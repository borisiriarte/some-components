<!DOCTYPE html>
<html lang="en">

    <title>Linear Interpolation</title>

  <body>
    <canvas id="myCanvas"></canvas>
    <script>
      myCanvas.width = window.innerWidth;
      myCanvas.height = window.innerHeight;

      const A = { x: 200, y: 300 };
      const B = { x: 400, y: 100 };

      const orange = { r: 230, g: 100, b: 0 };
      const blue = { r: 0, g: 70, b: 160 };

      const lowFreq = 200;
      const hihgFreq = 600;

      const ctx = myCanvas.getContext("2d");

      let osc = null;
      let audioCtx = null;

      // myCanvas.onclick = function () {
      //   if (audioCtx === null) {
      //     audioCtx = new (AudioContext ||
      //       webkitAudioContext ||
      //       window.webkitAudioContext)();
      //     osc = audioCtx.createOscillator();
      //     osc.frequency.value = 200;
      //     osc.start();

      //     const node = audioCtx.createGain();
      //     node.gain.value = 0.1;

      //     osc.connect(node);
      //     node.connect(audioCtx.destination);
      //   }
      // };

      myCanvas.onclick = function () {
        animate();
      };
      myCanvas.onclick = function () {};

      let t = 0;
      animate();

      function animate() {
        ctx.clearRect(0, 0, myCanvas.width, myCanvas.height);

        drawDot(A);
        drawDot(B);
        const sec = new Date().getTime() / 1000;
        // const t = sec;
        const C = vLerp(A, B, t);
        // console.log(sec);
        drawDot(C, "red");

        // const { r, g, b } = vLerp(orange, blue, t);
        // myCanvas.style.backgroundColor = `rgb(${r},${g},${b})`;

        // if (osc) {
        //   osc.frequency.value = lerp(lowFreq, hihgFreq, t);
        // }
        console.log(t);
        t += 0.2 ** 2;

        // ctx.strokeStyle = "white";
        // ctx.textAlign = "center";
        // ctx.textBaseline = "top";
        // ctx.font = "bold 40px Arial";
        // ctx.setLineDash([lerp(3, 200, t), 0]);
        // ctx.strokeText("Click For Sound", myCanvas.width / 2, 10);
        // ctx.setLineDash([]);
        // ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
        // ctx.fillText("Click For Sound", myCanvas.width / 2, 10);

        if (t > 1.000000001) {
          cancelAnimationFrame(animate);
        } else {
          requestAnimationFrame(animate);
        }
      }

      function vLerp(A, B, t) {
        const res = {};
        for (let attr in A) {
          res[attr] = lerp(A[attr], B[attr], t);
        }
        // console.log(res);
        return res;
      }

      // function vLerp(A, B, t) {
      //   return {
      //     x: lerp(A.x, B.x, t),
      //     y: lerp(A.y, B.y, t),
      //   };
      // }

      function lerp(min, max, t) {
        return min + (max - min) * t;
      }

      // const A = { x: 200, y: 300 };
      // const B = { x: 400, y: 100 };
      //lerp(200, 400, 10)
      //200 + (200) *100

      function drawDot(pos, color = "black") {
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.arc(pos.x, pos.y, 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // ctx.fillStyle = "black";
        // ctx.textAlign = "center";
        // ctx.textBaseline = "middle";
        // ctx.font = "bold 14px Arial";
        // ctx.fillText(pos.x, pos.y);
      }
    </script>
