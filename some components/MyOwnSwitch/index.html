<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>My Own Switch</title>
  </head>
  <body>
    <div class="switch">
      <input type="checkbox" id="switch" checked="true" />
      <label for="switch">
        <div class="circle"></div>
        <div class="sticker">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </label>
    </div>

    <div class="switch">
      <input type="checkbox" id="switch-1" />
      <label for="switch-1">
        <div class="circle"></div>
        <div class="circle circle-1">
          <div class="circle-secondary"></div>
        </div>
      </label>
    </div>

    <div class="switch">
      <input type="checkbox" id="switch-2" />
      <label for="switch-2">
        <div class="circle"></div>
        <div class="letter">
          <div>L</div>
          <div>R</div>
        </div>
      </label>
    </div>

    <script src="script.js"></script>
  </body>
</html>
